[package]
description = "Agent tool-calling foundation: lexical code search (in-memory BM25 + Tantivy), async bash sessions, and a thin tool registry."
edition.workspace = true
name = "sui-tools"
version.workspace = true

[dependencies]
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tantivy = "0.26.1"
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "process",
  "rt",
  "sync",
  "time",
] }

[dev-dependencies]
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "process",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }

[lints]
workspace = true
