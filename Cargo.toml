[workspace]
members = [
  "sui",
  "sui-app",
  "sui-llm",
  "sui-tools",
  "sui-widget",
  "sui-workflow",
]
resolver = "3"

[workspace.dependencies]
async-openai = { version = "0.41.3", features = ["chat-completion"] }
codewandler-markdown = "0.2.1"
codewandler-markdown-ratatui = "0.2.1"
color-eyre = "0.6.5"
crossterm = "0.29.0"
futures = "0.3.34"
ratatui = { version = "0.30.2", default-features = false, features = ["scrolling-regions"] }
rhai = { version = "1.23.6", features = ["no_time", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
sui-app = { path = "./sui-app" }
sui-llm = { path = "./sui-llm" }
sui-tools = { path = "./sui-tools" }
sui-widget = { path = "./sui-widget" }
sui-workflow = { path = "./sui-workflow" }
thiserror = "2.0.20"
tokio = "1.53.1"
unicode-width = "0.2.2"
wiremock = "0.6.5"

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
nursery = "deny"
panic = "deny"
pedantic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
future_incompatible = "deny"
unsafe_code = "deny"
unused = "deny"

[workspace.package]
edition = "2024"
version = "0.0.0"
