[workspace]
members = ["sui", "sui-app", "sui-widget"]
resolver = "3"

[workspace.dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false }
sui-app = { path = "./sui-app" }
sui-widget = { path = "./sui-widget" }
thiserror = "2.0.20"
tokio = "1.53.1"
unicode-width = "0.2.2"

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
nursery = "deny"
panic = "deny"
pedantic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
future_incompatible = "deny"
unsafe_code = "deny"
unused = "deny"

[workspace.package]
edition = "2024"
version = "0.0.0"
